    <!-- Lien vers la feuille de style externe -->
    <link rel="stylesheet" href="style.css">

<body>

<div class="steam-profile-card">
    <!-- En-tête -->
    <div class="profile-header">
        <div class="avatar-container">
            <!-- Remplacez src par l'URL de votre avatar -->
            <img src="https://imgs.search.brave.com/r-ctt829SYTHxGVhKo90q-5-ejPcaY5YedYIz6zU6xI/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9jZG4t/dGh1bWJzLm9obXlw/cmludHMubmV0LzEv/ZDViZjdkN2RhNDg1/NzBlNmE0ZTI1YmJi/NTUxMDEyZDcvMzUw/eDM1MC9keW5hbWlj/LXNpemUvZml0LzI0/MmI3Yjg3NTk2ODM2/YTlkNTI4YThhNjk2/ZDYxMjJkNDBjNTBl/OTYyMzdiMzhkZDll/OTljZjM2MmIxMGE1/ZjIuanBn" alt="Avatar">
        </div>
        <div class="user-info">
            <h2>LordR0gue4</h2>
            <p>Dijon France</p>
            <div class="level-badge">23</div>
        </div>
    </div>

    <!-- Activité en cours -->
    <div class="profile-section">
        <h3>Activité actuelle</h3>
        <div class="current-game">
            <div class="game-details">
                <span>GTA VI</span>
                <small>En jeu,</small>
                <small>oui il est pas sur PC et alors ?</small>
            </div>
        </div>
    </div>

    <!-- Vitrine de badges -->
    <div class="profile-section">
        <h3>Vitrine de badges</h3>
        <div class="showcase">
            <div class="badge-item">🏆 Année de service</div>
            <div class="badge-item">⭐ Collectionneur</div>
            <div class="badge-item">🎮 Vétéran CS</div>
        </div>
    </div>
</div>
